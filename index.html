<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstroQuantum Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Exo+2:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Exo 2"', 'sans-serif'],
              display: ['"Cinzel"', 'serif'],
              mono: ['"Space Grotesk"', 'monospace'],
            },
            colors: {
              space: {
                900: '#050511',
                800: '#0a0a2e',
                700: '#1a1a40',
                accent: '#00f0ff',
                purple: '#7000ff',
              }
            },
            animation: {
              'spin-slow': 'spin 60s linear infinite',
              'spin-reverse-slow': 'spin 80s linear infinite reverse',
              'pulse-glow': 'pulse-glow 3s infinite',
            },
            keyframes: {
              'pulse-glow': {
                '0%, 100%': { opacity: 1, filter: 'brightness(1)' },
                '50%': { opacity: 0.8, filter: 'brightness(1.3)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #050511;
        color: #ffffff;
        overflow-x: hidden;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a2e;
      }
      ::-webkit-scrollbar-thumb {
        background: #1a1a40;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #7000ff;
      }
    </style>
